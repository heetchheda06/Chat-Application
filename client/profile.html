<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile | WaveChat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-wave sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html">
        <div class="brand-logo-icon">
          <i class="bi bi-broadcast-pin"></i>
        </div>
        <span class="fs-4 brand-font text-dark">Wave<span class="text-primary">Chat</span></span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
          <li class="nav-item"><a class="nav-link" href="chat.html"><i class="bi bi-chat-dots me-1"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="groups.html">Groups</a></li>
          <li class="nav-item"><a class="nav-link" href="wmc.html">WMC Concepts</a></li>
          <li class="nav-item"><a class="nav-link" href="network.html">Network Status</a></li>
          <li class="nav-item"><a class="nav-link active" href="profile.html">Profile</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="py-5">
    <div class="container" style="max-width: 720px;">
      
      <div class="glass-card p-4 p-md-5 shadow-sm">
        <div class="text-center mb-4">
          <div class="position-relative d-inline-block mb-3">
            <img src="" id="profAvatar" width="100" height="100" class="rounded-circle shadow border border-3 border-primary" alt="Avatar">
            <span class="status-dot online position-absolute bottom-0 end-0 p-2" title="Online Node"></span>
          </div>
          <h3 class="fw-bold mb-1" id="profFullName">Loading...</h3>
          <p class="text-muted small mb-2" id="profUsername">@username</p>
          <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-1" id="profRoleBadge">Wireless Node</span>
        </div>

        <div id="profAlert" class="alert d-none mb-4"></div>

        <form id="profileForm">
          <div class="mb-3">
            <label class="form-label fw-semibold small text-muted">Full Name</label>
            <input type="text" class="form-control" id="inputFullName" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold small text-muted">Email Address (Read-only)</label>
            <input type="email" class="form-control bg-light" id="inputEmail" readonly>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold small text-muted">Wireless Status Message / Bio</label>
            <input type="text" class="form-control" id="inputStatusMsg" placeholder="e.g. Connected via 5G Mobile Hotspot">
          </div>

          <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
            <button type="button" class="btn btn-outline-danger btn-sm" id="profLogoutBtn">
              <i class="bi bi-box-arrow-right me-1"></i> Log Out
            </button>
            <button type="submit" class="btn btn-primary-gradient" id="saveProfBtn">
              <i class="bi bi-check2-circle me-1"></i> Save Changes
            </button>
          </div>
        </form>
      </div>

    </div>
  </main>

  <footer class="footer-wave">
    <div class="container text-center small text-secondary">
      WaveChat © 2026. Wireless Mobile Communication Academic Project Module.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Auth.requireAuth();
      const user = Auth.getUser();

      const profAvatar = document.getElementById('profAvatar');
      const profFullName = document.getElementById('profFullName');
      const profUsername = document.getElementById('profUsername');
      const profRoleBadge = document.getElementById('profRoleBadge');
      const inputFullName = document.getElementById('inputFullName');
      const inputEmail = document.getElementById('inputEmail');
      const inputStatusMsg = document.getElementById('inputStatusMsg');
      const profileForm = document.getElementById('profileForm');
      const profAlert = document.getElementById('profAlert');
      const profLogoutBtn = document.getElementById('profLogoutBtn');

      if (user) {
        profAvatar.src = user.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${user.username}`;
        profFullName.textContent = user.fullName;
        profUsername.textContent = '@' + user.username;
        profRoleBadge.textContent = user.role === 'admin' ? 'System Administrator' : 'Wireless Client Station';
        inputFullName.value = user.fullName;
        inputEmail.value = user.email;
        inputStatusMsg.value = user.statusMessage || '';
      }

      profileForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fullName = inputFullName.value.trim();
        const statusMessage = inputStatusMsg.value.trim();

        const res = await Auth.apiRequest('/api/auth/profile', 'PUT', { fullName, statusMessage });
        if (res.ok && res.data.user) {
          Auth.saveAuth(Auth.getToken(), res.data.user);
          profFullName.textContent = res.data.user.fullName;
          profAlert.className = 'alert alert-success d-block';
          profAlert.textContent = 'Profile updated successfully!';
          setTimeout(() => profAlert.className = 'alert d-none', 3000);
        } else {
          profAlert.className = 'alert alert-danger d-block';
          profAlert.textContent = res.data.message || 'Error updating profile.';
        }
      });

      profLogoutBtn.addEventListener('click', () => Auth.logout());
    });
  </script>
</body>
</html>
